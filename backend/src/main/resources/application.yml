spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/attendance_db}
    username: ${DATABASE_USERNAME:attendance_user}
    password: ${DATABASE_PASSWORD:attendance_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 3
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  timezone: Asia/Kolkata
  attendance:
    work-start: ${WORK_START:09:30}
    late-grace-minutes: ${LATE_GRACE_MINUTES:10}
  admin:
    seed-username: ${ADMIN_SEED_USERNAME:admin}
    seed-password: ${ADMIN_SEED_PASSWORD:admin123}
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-min-32-chars}
    expiry-hours: 12
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

server:
  port: ${PORT:8080}
